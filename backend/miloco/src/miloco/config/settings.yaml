# miloco 后端默认配置
#
# 加载优先级（高 → 低）：
#   环境变量（MILOCO_* / MILOCO_SERVER__URL 等）
#   > $MILOCO_HOME/config.json（用户可编辑，结构见 settings.schema.json）
#   > 本文件（后端默认值）
#   > 代码默认值

# 是否启用调试模式
debug: false

# 目录配置（storage 相对路径基于 $MILOCO_HOME 解析）
directories:
  static: "static"    # 后端静态资源目录（相对后端源码 root）
  storage: "."        # 工作目录；"." 表示直接使用 $MILOCO_HOME
  models: "models"          # ONNX 模型目录；为空时默认 $MILOCO_HOME/models

# 多模态大模型（omni）默认配置
# - omni：当前生效配置（引擎兜底默认，住户在 web「模型」页配好 api_key / 换模型即覆盖）
# - omni_profiles：web「模型」页可切换的档案列表；不预置任何档案，由住户自行新增
# - api_key 一律留空，由住户在 web「模型」页填写(本文件不存任何密钥)；env / config.json 可覆盖
model:
  omni:
    label: "mimo"
    model: "xiaomi/mimo-v2.5"
    base_url: "https://api.xiaomimimo.com/v1"
    api_key: ""
  omni_profiles: []

# miloco 后端服务相关配置
server:
  host: "127.0.0.1"                                            # 后端监听 host(默认仅本机;开 LAN 改 0.0.0.0,详见 settings.py 注释)
  port: 1810                                                   # 后端监听端口
  log_level: "info"                                            # uvicorn 日志级别
  enable_console_logging: true                                 # 是否启用控制台日志
  # HTTPS / TLS 已废弃：backend 永远 HTTP，跨网加密走反代（nginx / cloudflare-tunnel）+ 真证书。
  # 旧 tls_certfile / tls_keyfile 字段保留，但写了也不生效（uvicorn 启动会打 deprecation warning）。

# SQLite 数据库连接参数
database:
  path: "miloco.db"          # 数据库文件（相对 storage 或绝对路径）
  timeout: 30.0              # 连接超时（秒）
  check_same_thread: false   # 是否强制单线程访问
  isolation_level: null      # 事务隔离级别；null 表示默认

# FastAPI 应用元信息
app:
  title: "Miloco backend"
  service_name: "miloco-backend"
  description: "Miloco backend, responsible for scheduling various modules"
  # version 不在此硬编码：运行时由 AppSettings._resolve_version() 读已安装包元数据
  # （env MILOCO_APP__VERSION / config.json 仍可覆盖）

# MIoT 云接入参数（可选值：cn / de / i2 / ru / sg / us）
miot:
  cloud_server: "cn"

# 通知发送运行参数
notify:
  dedup_window_sec: 60   # 相同通知文案在此窗口(秒)内只发一次；<=0 关闭去重

# 摄像头采集参数
camera:
  frame_interval: 1000   # 帧采集间隔（毫秒）
  max_cache_images: 6    # 最大缓存图像数量

# 规则引擎相关配置
rule:
  log_ttl: 30                  # 天
  default_duration_ratio: 0.6  # duration_seconds 窗口 True 比例默认阈值，未显式 --duration-ratio 时生效
  scene_trigger_max_retries: 2   # 场景触发失败自动重试次数（不含首次；0=不重试），指数退避
  scene_trigger_retry_delay_sec: 1.0  # 场景触发重试初始退避秒数（1s/2s/4s…，单次上限 30s）

# 感知管线配置
perception:
  log_ttl: 30                  # 感知日志保留天数
  tier_u_dump_enable: false    # POST /api/identity/pool/dump 调试端点开关（生产保持 false，本地调试可设 true）
  stale_window_sec: 10         # 窗口新鲜度门控(秒)：窗口采集时间距今超过该值=积压过期窗口(网络中断/休眠恢复后
                               # 批量补处理)，直接丢弃——不调 omni、不触发规则；0=关闭。正常 in_delay 毫秒~秒级，
                               # 实测故障可达 60+ 分钟
  collect:
    window_size: 5           # 时间窗口大小（秒）
    max_windows: 3           # 最大待处理窗口数
    settle_ms: 500           # 等待慢轨道的宽限期（毫秒）
    full_action: "clear"     # 窗口满载处理策略：drop | clear | keep
  engine:
    # 纯场景触发模式(web「场景联动」专用): 输入仅多帧画面、无音频;
    # 跳过人脸识别 / tracker / 身份上下文; 输出只出 matched(规则命中/退出),
    # 剥离 caption / speeches / suggestions, 最大化输出速度。
    # 改此键需重启后端生效。false = 完整感知(默认)。
    rule_only: true
    # rule_only 全量 system prompt（随包默认，可直接改）：非空时**原样**作为该模式的
    # system prompt 发给 omni，完全跳过内置拼接逻辑（角色/总原则/schema/字段说明/
    # camera_prompt 都不再注入）。下方即完整文本，改完生效方式：经 CLI
    # `config set perception.engine.rule_only_system_prompt ...` 或 config.json 修改 →
    # 下个感知窗口热生效；直接改本 yaml → 需重启后端。置空或删除该键 = 回退代码内置
    # 装配版（omni/constants.py + field_registry.py 的 rule_only 路径，非本段文本）。
    rule_only_system_prompt: |-
      你是一个判断对应场景描述是否命中的裁判。

      # 任务
      根据视频中的画面判断“待判断规则”中的场景描述是否相符。

      # 判定准则
      - 画面即事实：仅依据此刻画面直接可见的证据。若模糊、看不清、不确定或需猜测推测，一律判定 hit: false
      - 要素完备：场景包含的每个条件必须全部在画面中显性满足，否则 hit: false。

      # 输出格式
      {"matched_rules":[{"rule_name":"规则名称","reason":"判断依据","hit":true|false}]}

      # 字段约束
      - 只输出 JSON，不输出思考过程和任何解释。
      - matched_rules：针对“待判断规则”中每个规则是否命中的解释说明
      - rule_name：必须照抄“待判断规则”中的完整名称，严禁自创或修改。
      - reason：用一句话直接描述画面是否命中规则的客观细节（如：“画面中有一人在床上翻阅书籍”）。
      - hit：是否命中对应的规则场景，true 或者 false

      # 场景判定补充细则

      ## 「有人读书」

      只有全部满足才 hit=true：

      1. 人的臀部或躯干位于画面左侧床垫/床沿；站在床边、蹲地、坐地或椅子都不成立。
      2. 手中明确是有封面/多页纸张装订成的纸质书，而不是手机、笔记本电脑等电子屏幕。
      3. 必须检查是在低头看书，合上书或者抬头看向其他地方，即使手里仍拿着书也 hit=false。不得把“手里有书”推断成“目光在书上”。
      4. 低头阅读状态至少在两个不同视频帧中清楚出现。输入只有一帧，或只是拿起、整理、翻找、递交物品的瞬间，hit=false。

      画面里有书但无人，以及是在看手机、平板、笔记本电脑等，一律 hit=false。

      ## 「白色地面有黑色垃圾」

      目标区只限米色地毯右侧、床和扫地机前方的白色地板。床、地毯、柜子和其他区域不参与判断。

      hit=true：目标白色地板上直接可见至少一个与地面分离、静止落地的小型独立杂物。纸片、卡片、卫生纸、小纸团、碎屑、小颗粒、小黑块都算；可以只有一个、可以很小、可以是白色/浅色/深色，绝不因为规则名含“黑色”或物体像纸张就否定。白色纸片上放燕麦片也算。

      hit=false：白色地面只是空白平面，没有可明确指出位置和轮廓的独立小物体。不得把视频压缩噪点、地面纹理/接缝/反光、鞋边、人的影子或保护膜褶皱脑补成垃圾。

      以下不是垃圾：人物鞋脚裤腿；扫地机器人和基站；背包、易拉罐、行李箱等大件；家具、施工工具；床/地面的塑料保护膜；任何又细又长、连续弯曲或横穿地面的电源线/数据线/充电线。

      有人站立、蹲下、伸手或清扫本身既不证明也不否定垃圾；应单独检查白色地板上是否仍能直接看到具体的小型独立杂物。

      输出纪律：hit=true 的 reason 必须指出物体在白色地板的具体位置、颜色/形态，以及它为何不是线缆、鞋影、机器人或保护膜；无法给出这些直接证据就 hit=false。
    input:
      # 帧率旋钮集中在此一处(对应 InputConfig):
      #   fps      —— 下发/pipeline 帧率 = tracker 帧率(下采后 tracker 逐帧消费全部)
      #   omni_fps —— 送 omni 的视频帧率, 与 fps 解耦; omni 已是瓶颈, 不随 tracker 提频涨
      fps: 1
      omni_fps: 1
      video_short_edge: 512
      # rule_only 图片输入: 只取窗口最后一帧作输入图(省 token/更快; 静态状态类规则足够)。
      # false = 多帧全发(动作/手势类规则更稳)。热读、改配置免重启。默认开启。
      # 注意: 该开关仅在 rule_only_input=image 时生效。
      last_frame_only: true
      # rule_only 媒体输入模式: video=mp4 视频(默认; Gemini 视频按帧计费 ~66 tok/帧,
      # 同分辨率下 token 约为图片 1/4); image=窗口末帧 JPEG(~1064 tok/张, 对纯静态
      # 规则判定更聚焦)。热读、免重启。
      rule_only_input: video
      # rule_only 视频模式是否只合成窗口最后一帧的单帧 mp4(~66 tok, 最省):
      # false=全窗口帧合成(默认, 信息完整); true=单帧。热读、免重启。
      rule_only_video_single_frame: false
      # 固定输入源（本地测试用）：本地视频 clip 路径。配置后无论是否有摄像头在线，
      # 都以该视频作为模型的输入画面（替换摄像头），相当于默认至少有一路摄像头在线，
      # 没有摄像头也能本地跑通整个感知管线（rule_only 模式连端侧模型都不需要）。
      # 每窗把整段 clip 作为输入、窗间旋转 1 帧（相邻窗口画面不同，视觉 gate 正常放行）。
      # 热读：经 CLI `config set perception.engine.input.clip_source ...` 或 config.json
      # 修改后下个感知窗口生效；直接改本 yaml 需重启。空 = 关闭（摄像头输入）。
      # clip_source: "/Users/mi/APP/xiaomi-miloco/.vscode/assets/垃圾-反例/rn-01.mp4"
    # Smart Crop(智能裁切增强): 推理前定向裁切活动区域, 送更高等效分辨率的局部视频 + 全景参考帧。
    # 与 video_short_edge 正交 —— 裁不裁看这里, 多清晰看 video_short_edge; crop 视频等比放到
    # 逐轴贴住同档全景画面、参考帧只缩不放, 都跟着用户档走。热读、免重启。
    crop_enhance:
      # 双闸:enabled = 发版级开关(本文件随包发布、不由 admin API 写,只能改文件;false 时
      #       整个能力关掉、前端开关随之置灰);
      #       user_enabled = 单机用户开关(UI「智能裁切增强」,admin API 写 config.json)。
      #       两个都为 true 才裁。分两个 key 不是访问控制(本地部署拦不住),是配置层不同,
      #       见 perception/engine/config.py::CropEnhanceConfig 的 docstring。
      # 两闸默认放开:未改过 config.json / 未动 UI 开关的用户默认启用 Smart Crop。
      # 关闭任一闸即回退全景路径(不再裁切),但**不等于**字节回到未接本特性前 —— 全景与 crop
      # 共用 _encode_video_mp4,其放大分支的重采样核已随本特性换成 LANCZOS4(源短边 < 用户档
      # 时命中,如 720p 子码流 + 768/1080 档),故关闸后全景 clip 字节仍与接特性前不同。
      enabled: true
      user_enabled: true
      expand_ratio_h: 0.40
      expand_ratio_v: 0.30
      motion_diff_threshold: 40
      motion_min_block_ratio: 0.005
      motion_min_fill_ratio: 0.2
      motion_global_drift_ratio: 0.5
      crop_min_area_ratio: 0.10
      crop_max_area_ratio: 0.49
    gate:
      # visual 滞回时长(秒)。visual 最近通过过、距今 <= 此值时,本窗 visual 不通过
      # 也强制生成 packet 并打 hold 标志,保住 video 路由不被纯音频短路。
      # 0 = 关闭 hold。过长在画面间歇有变化的场景会持续续命窗口、期间静默窗也被
      # 拉起跑下游 omni,浪费调用;过短则人短暂静止时 video 路由会切走。
      hold_duration_sec: 90
    identity:
      # mock | real | deep_sort —— v1.2 主动注册默认 deep_sort,DeepSORT 内置
      # ReID 关联,跟踪更稳;额外暴露 Track.features deque 给陌生人池零额外推理
      # 取 emb。回退路径:切 "real" 启用纯 SORT(陌生人池退化为"只累积、不去重")。
      tracking_service_mode: "deep_sort"
    omni:
      timeout: 10.0 # 请求超时（秒）

    # 注：omni 身份识别系统（identity_engine）配置位于
    # ``perception/engine/identity/default_config.yaml``，本文件不维护其默认值。
    # 如需运维侧覆盖默认（少数场景），可在此追加 ``identity_engine:`` 块；
    # 加载时由 ``identity/config_loader.py::load_identity_engine_config`` 深合并。


# 消息投递调度参数
dispatcher:
  turn_wait_timeout_ms: 180000   # 同步等待单个 agent turn 结束的超时（毫秒）
  max_queue: 10                  # 每会话队列上限；超出按 (类型优先级, 条目级优先级, 入队时间) 淘汰最不紧急者
  message_ttl_sec: 300           # 待发送消息最大存活时长（秒）；入队龄超此值在入队/发送前清理，不再投递。<=0 关闭

# 可观测性
perf:
  enabled: true                # SQLite traces 采集开关
  retention:
    traces_days: 7             # traces / traces_device 表保留天数
    events_days: 7             # events 表保留天数
    agent_runs_days: 7         # agent_runs 表保留天数
    trace_jsonl_days: 7        # agent jsonl.gz 文件保留天数

# 产品级实验性功能开关（默认关，住户在 web 显式开启）
features:
  pet_recognition: false       # 宠物识别（实验性）总开关；关闭时前端隐藏入口、后端不注入宠物命名规则，已录数据保留
  pet_head_grounding: false     # 宠物头像头部定位子开关（默认开）；关则用全身 crop，仅在 pet_recognition 开启时有意义（内部调优，一般无需改动）
  pet_body_grounding: false     # 宠物本体定位子开关（默认开）；仅回退路径（框不到猫狗）用，裁本体作参考图，关则回退不产参考 crop（内部调优，一般无需改动）
  pet_reid_diverse: false       # 参考图多样性用人体 ReID 特征距离贪心选多姿态（默认开）；关或模型不可用回退 dHash，仅 pet_recognition 开时有意义（内部调优，一般无需改动）
