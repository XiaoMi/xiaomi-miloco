<!-- 菜单栏专用图标：只要 favicon 里那栋房子（去掉橙色圆角底），单色 + 透明背景，
     由启动器以 isTemplate 使用 —— 菜单栏浅色/深色外观、选中高亮都交给系统处理，
     不会出现「带底色的 App 图标缩小后四周一圈白边」的问题。
     viewBox 比房子(9..23)外扩 1.5 单位，留出菜单栏图标该有的呼吸空间。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 7.5 17 17">
  <path d="M9 14.5L16 9l7 5.5V22a1 1 0 0 1-1 1h-4v-5h-4v5h-4a1 1 0 0 1-1-1v-7.5z" fill="#000"/>
</svg>
