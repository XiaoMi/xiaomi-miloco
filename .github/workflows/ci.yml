# 主 CI 门禁：PR / push main 时跑 test + lint + build。
# 按模块拆成并行 job，全量跑（不按变更范围筛选）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── workflow-sanity：workflow YAML 不许有 tab（YAML 缩进必须空格）──
  workflow-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: 检查 workflow YAML 无 tab 缩进
        run: |
          if grep -Pnl '\t' .github/workflows/*.yml; then
            echo "::error::上述 workflow 文件含 tab，请改用空格缩进"
            exit 1
          fi
          echo "✓ 无 tab"

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: 安装系统依赖（音视频处理）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: backend miloco 测试
        run: cd backend && uv sync --all-packages && uv run pytest -v
      - name: miot 单元测试
        run: cd backend && uv run pytest miot/tests/ -m unit -v

  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: cli 测试
        run: cd cli && uv sync && uv run pytest -v

  plugin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-all
      - name: openclaw 插件测试
        run: cd plugins/openclaw && pnpm install --frozen-lockfile && pnpm test

  hermes-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: hermes 插件测试
        run: uv run --with pytest --with httpx --with anyio python -m pytest plugins/hermes/tests/ -v

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-all
      - name: 安装依赖
        run: cd web && pnpm install --frozen-lockfile
      - name: 类型检查
        run: cd web && pnpm typecheck
      - name: 单元测试
        run: cd web && pnpm test
      - name: 构建（vite）
        run: cd web && pnpm build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # launcher 守卫要算 PR 改动集（对比 base 的 merge-base），需要完整历史
          fetch-depth: 0
      - uses: ./.github/actions/setup-all
      - name: launcher 守卫（vendored 启动器）
        # 入库的 miloco.app 是手工重编后 vendored 的，"源码与二进制同步"没有机器约束。
        # 硬失败只覆盖可确定性验证的部分（双架构 fat + plist 关键字段）；改了 src 却没
        # 重编入库只告警 —— 纯注释改动重编后字节相同，硬失败会变成无法满足的红灯。
        #
        # 本 workflow 同时被 push(main) 触发，那时 github.base_ref 是空串：不显式分流
        # 就会去跑 `git diff origin/...HEAD`（fatal，exit 128），只靠 bash 不带 pipefail
        # 蒙混成绿灯，且 main 每次 push 都打一行 git 报错。
        # pipefail：分流之后余下的失败（fetch 取不到 base / diff 报错）一律让本步直接红，
        # 不再有"守卫静默跳过却显示通过"的形态。
        run: |
          set -o pipefail
          # 先跑脚本自带的回归样本：判定逻辑被同一个失效模式咬过两次，都靠人眼才发现
          # （见 launcher-guard.py 的 self_test docstring）
          python3 .ci/launcher-guard.py --self-test
          base="${{ github.base_ref }}"
          if [ -z "$base" ]; then
            # push(main)：没有 PR base，只跑硬校验（空 stdin → 漂移告警自动跳过）
            python3 .ci/launcher-guard.py < /dev/null
          else
            git fetch --no-tags origin "$base"
            git diff "origin/$base...HEAD" | python3 .ci/launcher-guard.py
          fi
      - name: ruff（backend + cli）
        # 用 backend 环境的 ruff 一次扫两处：ruff 是纯静态分析无需装 cli 依赖，
        # 且会按各自 pyproject 解析配置（cli 未把 ruff 列为依赖，故不能 cd cli && uv run ruff）。
        run: |
          cd backend && uv sync --all-packages
          uv run ruff check . "$GITHUB_WORKSPACE/cli"
      - name: 类型检查（openclaw 插件，tsc --noEmit）
        run: cd plugins/openclaw && pnpm install --frozen-lockfile && pnpm check
